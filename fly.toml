app = "numbers-evolution"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/app/bin/numbers_evolution eval NumbersEvolution.Release.migrate"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[env]
  PORT = "4000"
  MIX_ENV = "prod"
  PHX_SERVER = "true"

[[mounts]]
  source = "numbers_evolution_storage"
  destination = "/app/uploads"
