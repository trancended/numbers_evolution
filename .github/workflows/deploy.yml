name: Deploy to Fly.io

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  quality-gate:
    name: Pre-deployment Quality Gate
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: numbers_evolution_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Elixir Environment
      uses: ./.github/actions/setup-elixir
      with:
        elixir-version: '1.19.3'
        otp-version: '28.1'
        mix-env: 'test'

    - name: Setup Database
      uses: ./.github/actions/setup-database
      with:
        mix-env: 'test'
        database-url: postgresql://postgres:postgres@localhost:5432/numbers_evolution_test

    - name: Run Quality Checks
      uses: ./.github/actions/quality-checks
      with:
        mix-env: 'test'
        database-url: postgresql://postgres:postgres@localhost:5432/numbers_evolution_test
        run-credo: 'true'
        run-tests: 'true'
        run-precommit: 'false'

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-22.04
    needs: quality-gate

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Fly CLI
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Verify Fly token
      run: |
        if [ -z "$FLY_API_TOKEN" ]; then
          echo "❌ FLY_API_TOKEN is not set!"
          echo "Please add FLY_API_TOKEN to GitHub Secrets"
          exit 1
        fi
        echo "✅ FLY_API_TOKEN is present"
        flyctl auth whoami
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    - name: Start database machine
      run: |
        echo "🗄️ Starting database machine..."
        # List machines to find the database machine ID
        DB_MACHINE_ID=$(flyctl machines list --app numbers-evolution-db --json | jq -r '.[0].id')
        echo "Database machine ID: $DB_MACHINE_ID"
        
        # Start the database machine
        flyctl machines start $DB_MACHINE_ID --app numbers-evolution-db || echo "Database machine already running"
        
        # Wait for database to be ready
        echo "⏳ Waiting for database to be ready..."
        sleep 10
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    - name: Deploy to Fly.io
      run: |
        echo "🚀 Deploying to Fly.io..."
        flyctl deploy --app numbers-evolution --remote-only --ha=false
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    - name: Check deployment status
      run: |
        echo "✅ Deployment complete!"
        echo "Migrations run automatically via release_command in fly.toml"
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-22.04
    needs: deploy

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check application health
      run: |
        echo "🔍 Verifying deployment..."
        sleep 10
        
        APP_URL="https://numbers-evolution.fly.dev"
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL")
        
        if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 302 ]; then
          echo "✅ Application is responding with status code: $HTTP_CODE"
          echo "🌐 Application is live at: $APP_URL"
        else
          echo "❌ Application health check failed with status code: $HTTP_CODE"
          exit 1
        fi

    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ Deployment successful!"
          echo "🌐 Application URL: https://numbers-evolution.fly.dev"
        else
          echo "❌ Deployment verification failed!"
        fi

