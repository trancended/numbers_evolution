name: CI/CD Pipeline

on:
  push:
    branches: [ main, e2e_cicd ]
  pull_request:
    branches: [ main, e2e_cicd ]

env:
  MIX_ENV: test
  ELIXIR_VERSION: '1.19.3'
  OTP_VERSION: '28.1'

jobs:
  test:
    name: Test & Format Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: numbers_evolution_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Cache deps
      uses: actions/cache@v4
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-

    - name: Install dependencies
      run: |
        mix local.rebar --force
        mix local.hex --force
        mix deps.get

    - name: Check Formatting
      run: mix format --check-formatted

    - name: Compile
      run: mix compile --warnings-as-errors

    - name: Run tests
      run: mix test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: numbers_evolution_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Cache deps
      uses: actions/cache@v4
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-

    - name: Install Elixir dependencies
      run: |
        mix local.rebar --force
        mix local.hex --force
        mix deps.get

    - name: Install Node.js dependencies
      run: npm ci

    - name: Compile assets
      run: mix assets.deploy
      env:
        MIX_ENV: test_e2e

    - name: Setup database
      run: |
        MIX_ENV=test_e2e mix ecto.create
        MIX_ENV=test_e2e mix ecto.migrate
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/numbers_evolution_e2e

    - name: Start Phoenix server
      run: |
        MIX_ENV=test_e2e mix phx.server > phoenix.log 2>&1 &
        echo $! > phoenix.pid
        # Wait for server to be ready
        for i in {1..30}; do
          if curl -s http://127.0.0.1:4000 > /dev/null 2>&1; then
            echo "Server is ready!"
            break
          fi
          echo "Waiting for server... ($i/30)"
          sleep 2
        done
        if ! curl -s http://127.0.0.1:4000 > /dev/null 2>&1; then
          echo "Server failed to start. Log output:"
          cat phoenix.log
          exit 1
        fi
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/numbers_evolution_e2e
        SECRET_KEY_BASE: U0ZJ6WUkQ2V39V6Z6p9uiYu9Ylm0TAezBEhxUhigJRQKyCSp7KJ7dFB4MDQ251vG
        PHX_HOST: localhost
        PORT: 4000

    - name: Run Cypress E2E tests
      run: npx cypress run
      env:
        CYPRESS_BASE_URL: http://localhost:4000

    - name: Stop Phoenix server
      if: always()
      run: |
        if [ -f phoenix.pid ]; then
          kill $(cat phoenix.pid) || true
          rm phoenix.pid
        fi

    - name: Upload Cypress screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-screenshots
        path: cypress/screenshots
        if-no-files-found: ignore

    - name: Upload Cypress videos
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-videos
        path: cypress/videos
        if-no-files-found: ignore

    - name: Upload Phoenix logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: phoenix-logs
        path: phoenix.log
        if-no-files-found: ignore
