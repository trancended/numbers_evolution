name: CI/CD Pipeline

on:
  push:
    branches: [ main, e2e_cicd ]
  pull_request:
    branches: [ main, e2e_cicd ]

env:
  MIX_ENV: test
  ELIXIR_VERSION: '1.19.3'
  OTP_VERSION: '28.1'

jobs:
  test:
    name: Test & Format Check
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        ports:
          - 5436:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: numbers_evolution_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Clean up previous containers and ports
      run: |
        # Targeted cleanup - only clean up containers from previous runs
        echo "Cleaning up containers from previous workflow runs..."
        # Stop containers that might be using our port (excluding current job containers)
        if docker ps -q --filter "label=com.github.actions.job" | head -n -1 | grep -q .; then
          docker ps -q --filter "label=com.github.actions.job" | head -n -1 | xargs docker stop || true
        fi
        if docker ps -aq --filter "label=com.github.actions.job" | head -n -1 | grep -q .; then
          docker ps -aq --filter "label=com.github.actions.job" | head -n -1 | xargs docker rm || true
        fi
        # Clean up orphaned containers
        docker container prune -f || true
        # Kill any processes using our specific port (alternative to lsof)
        netstat -tlnp 2>/dev/null | grep ":5436 " | awk '{print $7}' | cut -d'/' -f1 | xargs kill -9 || true 2>/dev/null || true
        # Brief wait
        sleep 1
        echo "Cleanup completed."
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Cache deps
      uses: actions/cache@v4
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-

    - name: Install dependencies
      run: |
        mix local.rebar --force
        mix local.hex --force
        mix deps.get

    - name: Check Formatting
      run: mix format --check-formatted
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5436/numbers_evolution_test

    - name: Compile
      run: mix compile --warnings-as-errors
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5436/numbers_evolution_test

    - name: Setup database
      run: |
        mix ecto.create
        mix ecto.migrate
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5436/numbers_evolution_test

    - name: Run tests
      run: mix test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5436/numbers_evolution_test

  e2e:
    name: E2E Tests (TEMPORARILY SKIPPED)
    runs-on: ubuntu-22.04
    needs: test
    if: false  # Temporarily disabled - too long

    services:
      postgres:
        image: postgres:16
        ports:
          - 5437:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: numbers_evolution_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Clean up previous containers and ports
      run: |
        # Targeted cleanup - only clean up containers from previous runs
        echo "Cleaning up containers from previous workflow runs..."
        # Stop containers that might be using our port (excluding current job containers)
        if docker ps -q --filter "label=com.github.actions.job" | head -n -1 | grep -q .; then
          docker ps -q --filter "label=com.github.actions.job" | head -n -1 | xargs docker stop || true
        fi
        if docker ps -aq --filter "label=com.github.actions.job" | head -n -1 | grep -q .; then
          docker ps -aq --filter "label=com.github.actions.job" | head -n -1 | xargs docker rm || true
        fi
        # Clean up orphaned containers
        docker container prune -f || true
        # Kill any processes using our specific port (alternative to lsof)
        netstat -tlnp 2>/dev/null | grep ":5437 " | awk '{print $7}' | cut -d'/' -f1 | xargs kill -9 || true 2>/dev/null || true
        # Brief wait
        sleep 1
        echo "Cleanup completed."
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Cache deps
      uses: actions/cache@v4
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-

    - name: Install Elixir dependencies
      run: |
        mix local.rebar --force
        mix local.hex --force
        mix deps.get

    - name: Install Node.js dependencies
      run: npm ci

    - name: Install system dependencies for Cypress
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Compile assets
      run: mix assets.deploy
      env:
        MIX_ENV: test_e2e

    - name: Setup database
      run: |
        MIX_ENV=test_e2e mix ecto.create
        MIX_ENV=test_e2e mix ecto.migrate
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5437/numbers_evolution_e2e

    - name: Start Phoenix server
      run: |
        echo "Starting Phoenix server..."
        MIX_ENV=test_e2e mix phx.server > phoenix.log 2>&1 &
        SERVER_PID=$!
        echo $SERVER_PID > phoenix.pid
        echo "Server started with PID: $SERVER_PID"

        # Give server a moment to start
        sleep 3

        # Check if process is still running
        if kill -0 $SERVER_PID 2>/dev/null; then
          echo "Phoenix server process is running"
        else
          echo "Phoenix server process failed to start"
          echo "Log output:"
          cat phoenix.log
          exit 1
        fi

        # Wait for server to be ready
        echo "Waiting for Phoenix server to start..."
        for i in {1..30}; do
          if curl -s http://127.0.0.1:4000 > /dev/null 2>&1; then
            echo "Phoenix server is responding on attempt $i!"
            break
          fi
          echo "Attempt $i: Server not ready yet, waiting..."
          sleep 2
          if [ $i -eq 30 ]; then
            echo "Server failed to start after 60 seconds"
            echo "Process status:"
            ps aux | grep phoenix || true
            echo "Recent log output:"
            tail -50 phoenix.log
            echo "Full log output:"
            cat phoenix.log
            exit 1
          fi
        done

        echo "Testing E2E endpoint availability..."
        sleep 2

        # Test the E2E reset endpoint
        echo "Testing /api/e2e/reset-db endpoint..."
        RESPONSE=$(curl -s -X POST http://127.0.0.1:4000/api/e2e/reset-db -H "Content-Type: application/json")
        echo "E2E endpoint response: $RESPONSE"

        # Check if response contains success status
        if echo "$RESPONSE" | grep -q '"status":"ok"'; then
          echo "E2E endpoint is working correctly!"
        else
          echo "E2E endpoint test failed!"
          exit 1
        fi
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5437/numbers_evolution_e2e
        SECRET_KEY_BASE: U0ZJ6WUkQ2V39V6Z6p9uiYu9Ylm0TAezBEhxUhigJRQKyCSp7KJ7dFB4MDQ251vG
        PHX_HOST: localhost
        PORT: 4000
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'sk-or-v1-dummy-key-for-ci-testing-only' }}

    - name: Run Cypress E2E tests
      run: xvfb-run --auto-servernum npx cypress run
      env:
        CYPRESS_BASE_URL: http://localhost:4000

    - name: Stop Phoenix server
      if: always()
      run: |
        if [ -f phoenix.pid ]; then
          SERVER_PID=$(cat phoenix.pid)
          echo "Stopping Phoenix server (PID: $SERVER_PID)..."
          kill $SERVER_PID || true
          rm phoenix.pid
        fi

    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: e2e-artifacts
        path: |
          cypress/videos/
          cypress/screenshots/
          phoenix.log
        retention-days: 7
