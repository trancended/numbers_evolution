name: Master Branch Quality Gate

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  MIX_ENV: test
  ELIXIR_VERSION: '1.19.3'
  OTP_VERSION: '28.1'

jobs:
  quality-check:
    name: Quality Assessment
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: numbers_evolution_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Clean up previous containers and ports
      run: |
        # Targeted cleanup - only clean up containers from previous runs
        echo "Cleaning up containers from previous workflow runs..."
        # Stop containers that might be using our port (excluding current job containers)
        if docker ps -q --filter "label=com.github.actions.job" | head -n -1 | grep -q .; then
          docker ps -q --filter "label=com.github.actions.job" | head -n -1 | xargs docker stop || true
        fi
        if docker ps -aq --filter "label=com.github.actions.job" | head -n -1 | grep -q .; then
          docker ps -aq --filter "label=com.github.actions.job" | head -n -1 | xargs docker rm || true
        fi
        # Clean up orphaned containers
        docker container prune -f || true
        # Kill any processes using our specific port (alternative to lsof)
        netstat -tlnp 2>/dev/null | grep ":5433 " | awk '{print $7}' | cut -d'/' -f1 | xargs kill -9 || true 2>/dev/null || true
        # Brief wait
        sleep 1
        echo "Cleanup completed."

    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Elixir Environment
      uses: ./.github/actions/setup-elixir
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}
        mix-env: ${{ env.MIX_ENV }}

    - name: Setup Database
      uses: ./.github/actions/setup-database
      with:
        mix-env: ${{ env.MIX_ENV }}
        database-url: postgresql://postgres:postgres@localhost:5433/numbers_evolution_test

    - name: Run Quality Checks
      uses: ./.github/actions/quality-checks
      with:
        mix-env: ${{ env.MIX_ENV }}
        database-url: postgresql://postgres:postgres@localhost:5433/numbers_evolution_test
        run-credo: 'true'
        run-tests: 'true'
        run-precommit: 'true'

  status-notification:
    name: Status Notification
    runs-on: ubuntu-22.04
    needs: quality-check
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Create status notification
      run: |
        job_result="${{ needs.quality-check.result }}"
        commit_sha="${{ github.sha }}"
        timestamp="$(date -Iseconds)"

        echo "=== Master Branch Quality Gate Status ==="
        echo "Status: $job_result"
        echo "Commit: ${commit_sha:0:7}"
        echo "Branch: master"
        echo "Timestamp: $timestamp"
        echo ""
        echo "Quality Checks Results:"
        if [ "$job_result" = "success" ]; then
          echo "- Code Formatting: ✅ Passed"
          echo "- Compilation: ✅ Passed"
          echo "- Linting (Credo): ✅ Passed"
          echo "- Unit Tests: ✅ Passed"
          echo "- Pre-commit Checks: ✅ Passed"
          echo ""
          echo "All quality gates passed. Ready for production deployment."
        else
          echo "- Code Formatting: ❌ Failed"
          echo "- Compilation: ❌ Failed"
          echo "- Linting (Credo): ❌ Failed"
          echo "- Unit Tests: ❌ Failed"
          echo "- Pre-commit Checks: ❌ Failed"
          echo ""
          echo "Quality checks failed. Deployment blocked until issues are resolved."
        fi
        echo ""
        echo "Generated by GitHub Actions - Master Branch Quality Gate"
